name: Telegram Online API checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/telegram-online-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax and Telegram signatures
        run: npm run check
